<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PortPlay - 257 Juegos Premium</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial, sans-serif}
.header{background:linear-gradient(135deg,#00ff88,#00cc6a);padding:20px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{color:#000;font-size:28px}
.header p{color:#000a;font-size:14px;font-weight:bold}
.search{margin:15px;background:#1a1a1a;border-radius:25px;padding:12px 20px;display:flex;align-items:center}
.search input{background:transparent;border:none;color:#fff;width:100%;outline:none;font-size:16px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.game{background:#1a1a1a;border-radius:15px;padding:12px;text-align:center;border:1px solid #222}
.game .icon{font-size:40px;margin-bottom:8px}
.game h3{font-size:13px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game .cat{font-size:10px;color:#00ff88;background:#00ff8822;padding:3px 8px;border-radius:10px}
.game .btn{margin-top:8px;background:#00ff88;color:#000;padding:6px;border-radius:20px;font-size:12px;font-weight:bold;display:block;text-decoration:none}
.footer{text-align:center;padding:20px;color:#555;font-size:11px}
</style>
</head>
<body>
<div class="header">
<h1>🎮 PORTPLAY</h1>
<p>257 JUEGOS PREMIUM - LAS HERAS</p>
</div>

<div class="search">
<span>🔍</span>
<input id="buscador" type="text" placeholder="Buscar juego... GTA, FIFA, Minecraft..." onkeyup="filtrar()">
</div>

<div class="games" id="lista"></div>

<div class="footer">
PortPlay v2.0 - Solo Android<br>
Las Heras, Mendoza 2026<br>
Hecho por Luca
</div>

<script>
const juegos = [
["GTA V","Acción","🚗"],["FIFA 24","Deportes","⚽"],["Minecraft","Aventura","⛏️"],["Call of Duty","Shooter","🔫"],["Free Fire MAX","Battle","🔥"],
["PES 2024","Deportes","⚽"],["Forza Horizon","Carreras","🏎️"],["God of War","Acción","🪓"],["Fortnite","Battle","💥"],["Roblox","Multijugador","🧱"],
["Among Us","Social","👨‍🚀"],["Clash Royale","Estrategia","👑"],["Brawl Stars","Acción","⭐"],["Stumble Guys","Party","😂"],["Pou","Casual","👽"]
];
// Generar 257
for(let i=16;i<=257;i++){juegos.push([`Juego Premium ${i}`,"Premium",`🎮`])}

const lista = document.getElementById('lista');
function mostrar(filtro=""){
  lista.innerHTML="";
  juegos.forEach((j,idx)=>{
    if(j[0].toLowerCase().includes(filtro.toLowerCase())){
      lista.innerHTML+=`
      <div class="game">
        <div class="icon">${j[2]}</div>
        <h3>${j[0]}</h3>
        <span class="cat">${j[1]}</span>
        <a class="btn" href="#" onclick="alert('Descargando ${j[0]}... ¡Pronto disponible!')">INSTALAR</a>
      </div>`;
    }
  });
}
function filtrar(){ mostrar(document.getElementById('buscador').value); }
mostrar();
</script>
</body>
</html>
